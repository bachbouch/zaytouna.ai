{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{% block title %}Zaytouna{% endblock %}</title>
<link rel="icon" type="image/png" href="{% static 'landing/assets/zaytouna-logo.png' %}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="{% static 'landing/css/landing.css' %}" rel="stylesheet" />
</head>
<body>
<div class="mesh-bg" aria-hidden="true">
  <div class="mesh-blob a"></div>
  <div class="mesh-blob b"></div>
  <div class="mesh-blob c"></div>
  <div class="mesh-grain"></div>
</div>

<div class="stage">
  <a href="/" class="auth-brand">
    <img src="{% static 'landing/assets/zaytouna-logo.png' %}" alt="" />
    <span class="auth-brand-name">Zaytouna</span>
  </a>

  <main class="auth-page">
    <div class="auth-card">
      <span class="auth-eyebrow">{% block eyebrow %}{% endblock %}</span>
      <h1 class="auth-title">{% block heading %}{% endblock %}</h1>
      {% block intro %}{% endblock %}

      {% block body %}{% endblock %}
    </div>

    {% block aside %}{% endblock %}
  </main>
</div>
</body>
</html>
